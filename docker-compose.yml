services:

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: math2latex_user
      POSTGRES_PASSWORD: math2latex_pass
      POSTGRES_DB: math2latex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U math2latex_user -d math2latex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DB_URL: postgresql://math2latex_user:math2latex_pass@db:5432/math2latex
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-deploy-2026}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Giới hạn upload/xử lý (xem backend/app/core/limits.py); mặc định khớp code.
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-200}
      MAX_PAGE_PIXELS: ${MAX_PAGE_PIXELS:-25000000}
      PDF_JOB_TIMEOUT_SECONDS: ${PDF_JOB_TIMEOUT_SECONDS:-1800}
      OCR_JOB_TIMEOUT_SECONDS: ${OCR_JOB_TIMEOUT_SECONDS:-3600}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_IP_MAX_FAILURES: ${LOGIN_IP_MAX_FAILURES:-30}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "math2latex"]
    # Chạy lại worker khi tiến trình thoát bất thường; không áp dụng khi dừng thủ công (`docker stop/kill`).
    # Job bị bỏ rơi được RQ gọi on_failure để trả công thức `ocr_queued` về `ocr_failed` (xem Docs/ARCHITECTURE.md).
    restart: unless-stopped
    # Uncomment 'gpus: all' to enable GPU support (requires nvidia-docker and GPU drivers)
    # gpus: all
    volumes:
      - ./backend:/app
    environment:
      DB_URL: postgresql://math2latex_user:math2latex_pass@db:5432/math2latex
      REDIS_URL: redis://redis:6379/0
      # Set to 'cuda' if using GPU, 'cpu' otherwise
      MATH_DETECTOR_DEVICE: ${MATH_DETECTOR_DEVICE:-cpu}
      MATH_DETECTOR_BACKEND: onnx
      # Worker kiểm tra lại PDF bằng cùng giới hạn với API.
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-200}
      MAX_PAGE_PIXELS: ${MAX_PAGE_PIXELS:-25000000}
      HF_ENDPOINT: https://huggingface.co
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata: